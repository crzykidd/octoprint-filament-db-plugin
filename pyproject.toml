[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-FilamentDB"
dynamic = ["version"]
description = "Assigns Filament DB spools to printer tools, meters actual extrusion, and writes print-history usage back to Filament DB."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.9"
authors = [{ name = "crzykidd" }]
classifiers = [
    "Framework :: OctoPrint",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Topic :: Printing",
]
dependencies = [
    "OctoPrint>=2.0.0rc4",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/crzykidd/octoprint-filament-db-plugin"
Source = "https://github.com/crzykidd/octoprint-filament-db-plugin"
Issues = "https://github.com/crzykidd/octoprint-filament-db-plugin/issues"

# The mechanism OctoPrint's plugin loader uses to discover a plugin package:
# an entry point in the "octoprint.plugin" group, keyed on the plugin
# identifier (docs/prd.md "Naming & repo").
[project.entry-points."octoprint.plugin"]
filamentdb = "octoprint_filamentdb"

[tool.setuptools.packages.find]
include = ["octoprint_filamentdb*"]

# Version is stored bare, in exactly one place (release-prep-and-cut rule in
# CLAUDE.md) -- octoprint_filamentdb/_version.py. Everything else, including
# this file, reads it from there rather than declaring its own copy.
[tool.setuptools.dynamic]
version = { attr = "octoprint_filamentdb._version.__version__" }

[tool.setuptools.package-data]
octoprint_filamentdb = [
    "templates/*.jinja2",
    "static/js/*.js",
    "static/css/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CI pins the ruff *version* (.github/workflows/ci.yml) so an unpinned `pip install
# ruff` doesn't pull whatever is newest; that alone isn't enough, because ruff's
# *default* enabled rule set has itself grown across versions -- checked ruff 0.8.4
# (this repo's baseline) against 0.16.1 and the newer default alone adds SIM/PLW/YTT
# findings on unchanged code. Pinning `select` explicitly here means a future,
# deliberate version bump can't silently widen what Lint checks the way an unpinned
# install could -- see the Lint job comment in ci.yml for the filament-bridge
# incident this mirrors.
[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
