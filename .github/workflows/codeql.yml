name: CodeQL

on:
  # The dev→main PR is the gate: pull_request scans changes BEFORE they can
  # reach main, and push:[main] re-scans + keeps the default-branch baseline
  # current. dev is intentionally NOT a push trigger -- scanning every dev
  # push would duplicate the pull_request run during an open PR (the same
  # stuck-required-check failure mode as ci.yml's push-only rule) and adds
  # heavy load to what are, on this project, frequent dev pushes.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'  # Monday 04:30 UTC
  # TEMP (2026-08-02): manual trigger to verify this workflow actually runs green
  # before it's relied on, without waiting for a main-bound PR. Removed once verified
  # -- see docs/decisions.md for why push:[dev] is deliberately not used instead.
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript is the correct language id even though this
        # project has no TypeScript -- it's CodeQL's identifier for the JS
        # analyzer, which is what static/js/*.js needs.
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Security-focused suite; code style/quality is owned by ruff (ci.yml).
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
